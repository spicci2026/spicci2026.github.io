<title>Scaccianoia</title>
<meta name="description" content="Idee gratis contro la noia, scelte in base al meteo, al posto in cui sei e al tempo che hai.">
<meta name="theme-color" content="#FFD23F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scaccianoia">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:title" content="Scaccianoia">
<meta property="og:description" content="Idee gratis contro la noia, scelte in base al meteo, al posto in cui sei e al tempo che hai.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&display=swap">
<style>
:root{
  /* Scaccianoia: biglietti gialli e timbri rossi su carta da zucchero. Una colonna sul telefono, cruscotto a griglia su schermi larghi; tutto allineato a sinistra. */
  --bg:#E9EFF6; --card:#FFFFFF; --sunk:#DCE4EE; --ink:#101A30; --ink-2:#414E68; --ink-3:#5F6C86; --line:#CBD5E2;
  --ticket:#FFD23F; --ticket-hi:#FFDD66; --ticket-ink:#2B1F00; --stamp:#C9342A; --blue:#1F5FBF; --mark:#2A78D6;
  --good:#0B7A4B; --warn-bg:#FFF0C7; --warn-ink:#5E4100;
  --f-d:"Bricolage Grotesque","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-b:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-m:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220; --card:#141D31; --sunk:#0F1829; --ink:#EDF2FA; --ink-2:#B5C0D6; --ink-3:#8D9AB4; --line:#2A3752;
    --ticket:#FFD23F; --ticket-hi:#FFDD66; --ticket-ink:#2B1F00; --stamp:#FF7A6B; --blue:#8DB4F5; --mark:#3987E5;
    --good:#4CC38A; --warn-bg:#3B2E08; --warn-ink:#FFD98A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --card:#141D31; --sunk:#0F1829; --ink:#EDF2FA; --ink-2:#B5C0D6; --ink-3:#8D9AB4; --line:#2A3752;
  --ticket:#FFD23F; --ticket-hi:#FFDD66; --ticket-ink:#2B1F00; --stamp:#FF7A6B; --blue:#8DB4F5; --mark:#3987E5;
  --good:#4CC38A; --warn-bg:#3B2E08; --warn-ink:#FFD98A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:var(--blue);text-underline-offset:3px}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--ink-3)}
.small{font-size:13.5px}
.pad{padding:14px 0}

/* ---------- struttura ---------- */
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.view{overflow-y:auto;overflow-x:hidden;outline:0;-webkit-overflow-scrolling:touch}
body.has-sheet .view{overflow:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 36px}
.nav{display:flex;justify-content:space-around;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;max-width:120px;display:grid;justify-items:center;gap:1px;padding:5px 2px 3px;border-radius:12px;text-decoration:none;color:var(--ink-3);font-size:12px;font-weight:700}
.nav a .ic{width:24px;height:24px;padding:4px 14px;box-sizing:content-box;border-radius:99px}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] .ic{background:var(--ticket);color:var(--ticket-ink)}
@media (min-width:900px){
  .app{grid-template-rows:none;grid-template-columns:96px minmax(0,1fr)}
  .nav{order:-1;flex-direction:column;justify-content:flex-start;gap:8px;border-top:0;border-right:1px solid var(--line);padding:22px 8px}
  .nav a{flex:0 0 auto;max-width:none;padding:8px 2px}
  .wrap{padding:22px 28px 44px}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{flex:none;display:inline-flex;align-items:center;gap:9px;font:800 23px/1 var(--f-d);font-stretch:84%;color:var(--ink);text-decoration:none}
.logo{width:32px;height:32px;flex:none}
.loc{display:inline-flex;align-items:center;gap:6px;flex:0 1 auto;min-width:0;max-width:58%;min-height:40px;padding:0 10px 0 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px}
.loc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc .ic{width:17px;height:17px;flex:none}
@media (max-width:359px){.top{gap:8px}.brand{font-size:20px;gap:7px}.logo{width:28px;height:28px}.loc{padding:0 9px 0 10px;font-size:13.5px}.loc .ic:last-child{display:none}}
.foot{margin-top:30px;font-size:12.5px;color:var(--ink-3);max-width:70ch}
.foot a{color:inherit}
.page{max-width:1000px}
.page-t{font:800 40px/1 var(--f-d);font-stretch:80%;letter-spacing:-.01em;margin:4px 0 14px}
.lead{font-size:17px;color:var(--ink-2);max-width:56ch;margin-bottom:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sec-h .lnk,.sec-h .muted{white-space:nowrap;font-size:14.5px}
.sec-h h2,.panel h2,.blk h2,.rules h2,.sheet h2{font:700 23px/1.1 var(--f-d);font-stretch:84%;text-wrap:balance}
.sub-h{font:700 18px/1.15 var(--f-d);font-stretch:86%;margin:20px 0 6px}
.panel{background:var(--card);border-radius:20px;padding:18px}

/* ---------- bottoni e campi ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid transparent;background:none;color:var(--ink);font-weight:700;font-size:15.5px;line-height:1.1;text-decoration:none;cursor:pointer}
.btn .ic{width:19px;height:19px}
.btn--sun{background:var(--ticket);color:var(--ticket-ink)}
.btn--sun:hover{background:var(--ticket-hi)}
.btn--ink{background:var(--ink);color:var(--bg)}
.btn--line{border-color:var(--line);background:var(--card)}
.btn--line:hover{border-color:var(--ink-3)}
.btn--quiet{color:var(--ink-2)}
.btn--quiet:hover{background:var(--sunk)}
.btn--quiet[aria-pressed="true"]{color:var(--ink)}
.btn--glass{background:rgba(255,255,255,.28);color:inherit}
.btn--s{min-height:38px;padding:0 12px;font-size:14.5px;border-radius:10px}
.btn--l{min-height:52px;padding:0 22px;font-size:17px}
.btn--xl{width:100%;min-height:70px;justify-content:flex-start;gap:14px;padding:10px 18px;border-radius:16px;text-align:left}
.moment h2{margin-top:18px}
.btn--xl .ic{width:32px;height:32px}
.btn--xl span{display:grid;font:800 25px/1 var(--f-d);font-stretch:82%}
.btn--xl small{font:500 13.5px/1.2 var(--f-b);font-stretch:normal;margin-top:5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.lnk{background:none;border:0;padding:0;color:var(--blue);font-weight:700;font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.moment > .lnk{display:inline-block;margin-top:12px;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip,.seg button{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:hover,.seg button:hover{border-color:var(--ink-3)}
.chip--link .ic{width:14px;height:14px;color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;margin-top:12px}
.fld-l{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.chips--scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
@media (min-width:720px){.chips--scroll{flex-wrap:wrap;overflow:visible;padding-bottom:0}}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--sunk);margin-bottom:16px;max-width:100%}
.tabs button{min-height:38px;padding:0 14px;border:0;border-radius:10px;background:none;font-weight:600;font-size:15px;color:var(--ink-2)}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700}
.inp{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.inp:focus-within{border-color:var(--blue)}
.inp input{flex:1;min-width:0;border:0;background:none;outline:0;min-height:42px}
.inp .ic{color:var(--ink-3)}
.in{display:block;width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
textarea.in{resize:vertical;line-height:1.4}
.lab{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
.fs{border:0;padding:0;margin:14px 0 0;min-width:0}
.fs legend{padding:0;font-size:14px;font-weight:700;margin-bottom:6px}
.radios{display:grid;gap:6px}
.radios label{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px}
.radios label:has(input:checked){border-color:var(--ink)}
.radios input,.check input{accent-color:var(--ink);width:18px;height:18px;flex:none;margin:0}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600;font-size:15px;cursor:pointer}
.checks{display:grid;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-weight:700;font-size:14.5px}
.note{display:flex;gap:8px;align-items:flex-start;margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-weight:600;font-size:14.5px}
.note .ic{margin-top:2px}
.note-box{display:flex;gap:10px;align-items:flex-start;margin:16px 0;padding:14px;border-radius:14px;background:var(--card);max-width:70ch}
.empty{display:grid;gap:10px;justify-items:start;padding:20px 18px;border-radius:16px;border:1.5px dashed var(--line);max-width:64ch}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ok-line{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--good);margin:0}
.facts{margin:10px 0 14px;padding:0;list-style:none;display:grid;gap:10px;max-width:68ch}
.facts li{padding-left:14px;border-left:3px solid var(--line);font-size:15px}

/* ---------- cruscotto ---------- */
.dash{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){
  .dash{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero,.picks,.moment{grid-column:1/-1}
}
@media (min-width:1100px){
  .dash{grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
  .hero,.picks{grid-column:span 8}
  .moment,.daily,.week,.near,.events{grid-column:span 4}
  .tools{grid-column:1/-1}
  .tools .rows{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;border-top:0}
  .tools .rows li{border-bottom:0}
  .tools .row{height:100%;grid-template-columns:minmax(0,1fr);align-content:start;gap:10px;padding:16px;border-radius:16px;background:var(--card)}
  .tools .row:hover{background:var(--card);outline:1.5px solid var(--ink-3)}
  .tools .row-ic{background:var(--ticket);color:var(--ticket-ink)}
  .tools .row-t b{white-space:normal}
}

/* la finestra sul cielo */
.hero{position:relative;overflow:hidden;display:flex;border-radius:26px;padding:22px 20px 18px;background:var(--sky-a);background:linear-gradient(180deg,var(--sky-a),var(--sky-b));min-height:250px}
.hero--d{color:#0E1A33}
.hero--l{color:#FFFFFF}
.hero a,.hero .lnk{color:inherit}
.sky-art{position:absolute;top:0;right:0;width:270px;aspect-ratio:2/1;pointer-events:none}
.sky-art .cl ellipse{fill:var(--cloud)}
.sky-art .st{fill:#FFFFFF;opacity:.85}
.sky-art .dr{stroke:rgba(255,255,255,.6);stroke-width:2;stroke-linecap:round;fill:none;animation:fall 1.1s linear infinite}
.sky-art .fk{fill:#FFFFFF;animation:flake 3.4s linear infinite}
.sky-art .fg{fill:#FFFFFF}
.sky-art .bolt{fill:#FFE066}
@keyframes fall{0%{transform:translate(4px,-10px);opacity:0}25%{opacity:1}100%{transform:translate(-4px,12px);opacity:0}}
@keyframes flake{0%{transform:translate(0,-14px);opacity:0}20%{opacity:1}100%{transform:translate(-8px,22px);opacity:0}}
.hero-in{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.hero-in > .hours,.hero-in > .wxm{margin-top:auto}
.hero-in > .now{margin-bottom:16px}
.hero-date{font-size:14.5px;line-height:1.35;font-weight:700;opacity:.85;max-width:calc(100% - 196px);min-height:100px}
.hero-title{font:800 clamp(31px,7.4vw,46px)/1.02 var(--f-d);font-stretch:78%;letter-spacing:-.012em;margin:6px 0 8px;text-wrap:balance;max-width:21ch}
.hero-sub{font-size:16px;max-width:46ch;opacity:.9}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.now{display:flex;align-items:center;gap:12px;margin-top:16px}
.now-temp{font:600 54px/1 var(--f-b);letter-spacing:-.03em}
.now-ic{width:42px;height:42px;stroke-width:1.6}
.now-txt{display:grid;min-width:0;font-size:14.5px;line-height:1.3}
.now-txt b{font-size:17px}
.now-txt span{opacity:.88}
.advice{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;max-width:60ch}
.advice li{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.3);font-size:14.5px;font-weight:700}
.hero--l .advice li{background:rgba(255,255,255,.16)}
.advice .ic{margin-top:1px}
.hours{list-style:none;margin:16px 0 0;padding:12px 0 0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-top:1px solid rgba(14,26,51,.2)}
.hero--l .hours{border-top-color:rgba(255,255,255,.3)}
.hours li{display:grid;justify-items:center;gap:2px;font-variant-numeric:tabular-nums}
.hours .ic{width:21px;height:21px}
.hours b{font-size:15px}
.h-t{font-size:12.5px;opacity:.85}
.h-p{font-size:11.5px;min-height:15px;opacity:.9}
.hero-tom{font-size:14px;font-weight:700;margin-top:12px}
.hero-src{font-size:12.5px;margin-top:6px;opacity:.88}
.hero-src .lnk{margin-left:6px}
.wxm{margin-top:16px;padding:14px;border-radius:16px;background:var(--card);color:var(--ink)}
.wxm-q{font-size:14.5px;font-weight:700;margin-bottom:10px}
.wxm-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:14.5px;font-weight:600}
.wxm-row output{min-width:44px;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.wxm .lnk{color:var(--blue)}
.step{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:700;line-height:1}
@media (min-width:720px){
  .hero{padding:26px 26px 20px}
  .sky-art{width:400px}
  .hero-title{max-width:min(62%,21ch)}
  .hero-date,.hero-sub{max-width:min(58%,44ch)}
  .hero-date{min-height:0}
  .hero-title{font-size:clamp(34px,4.3vw,48px)}
}

/* ---------- biglietti ---------- */
.tk{--notch:var(--bg);position:relative;display:grid;grid-template-columns:88px minmax(0,1fr);background:var(--card);color:var(--ink);border-radius:14px;overflow:hidden}
.tk-stub{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;background:var(--ticket);color:var(--ticket-ink);text-align:center}
.tk-ic{width:30px;height:30px;stroke-width:1.6}
.tk-cat{font-size:12.5px;font-weight:700;line-height:1.15}
.tk-no{margin-top:auto;font:400 11.5px/1 var(--f-m);letter-spacing:.02em}
.tk-body{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;padding:14px 16px 14px 18px;border-left:2px dashed var(--line)}
.tk-body::before,.tk-body::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--notch)}
.tk-body::before{top:-8px}
.tk-body::after{bottom:-8px}
.tk-title{font:800 21px/1.06 var(--f-d);font-stretch:80%;text-wrap:balance}
.tk-desc{font-size:15px;line-height:1.42;color:var(--ink-2)}
.meta{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:3px 12px;font-size:13.5px;color:var(--ink-2)}
.meta li{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:15px;height:15px}
.tk-why{display:flex;align-items:flex-start;gap:6px;font-size:13.5px;font-weight:700;color:var(--good);line-height:1.3}
.tk-why .ic{width:16px;height:16px;margin-top:1px}
.tk-need{font-size:14px;color:var(--ink-2)}
.tk-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tklist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr))}
.tklist--1{grid-template-columns:minmax(0,1fr)}
.count{font-size:13.5px;color:var(--ink-3);margin:12px 0 8px}
.more{margin-top:16px}
/* la striscia: tre biglietti ancora attaccati */
.strip{display:grid}
.strip .tk{border-radius:0}
.strip .tk:first-child{border-radius:14px 14px 0 0}
.strip .tk:last-child{border-radius:0 0 14px 14px}
.strip .tk:only-child{border-radius:14px}
.strip .tk + .tk{border-top:2px dashed var(--line)}
.strip .tk + .tk::before,.strip .tk:not(:last-child)::after{content:"";position:absolute;left:0;right:0;height:16px;z-index:2;pointer-events:none;

.votes span{color:var(--ink-2);white-space:nowrap}
.bingo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.bingo button{min-height:82px;padding:6px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;line-height:1.18;overflow-wrap:anywhere;hyphens:auto}
.bingo button[aria-pressed="true"]{background:var(--ticket);border-color:var(--ticket);color:var(--ticket-ink);font-weight:700;text-decoration:line-through;text-decoration-thickness:1.5px}
.bingo-s{margin-top:12px}

/* ---------- strumenti dentro i biglietti ---------- */
.tk-kit{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--blue);line-height:1.25}
.tk-kit .ic{width:16px;height:16px}
.tk--sheet .tk-kit{display:none}
.picks-f{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;margin-top:10px;font-size:13.5px;color:var(--ink-3)}
.picks-f .lnk{font-size:14.5px}
.pl-desc{margin-top:6px;color:var(--ink-2)}
.kit{display:grid;gap:10px;margin-top:12px}
.kb{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--card);min-width:0}
.kb-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.kb-ic{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--ticket);color:var(--ticket-ink)}
.kb-ic .ic{width:22px;height:22px}
.kb-h h3{font:700 20px/1.1 var(--f-d);font-stretch:84%;text-wrap:balance;padding-top:2px}
.kb-h p{margin-top:3px;font-size:14.5px;color:var(--ink-2)}
.kb h4{font-size:13.5px;font-weight:700;color:var(--ink-2);margin:2px 0 -4px}
.kb .lab{margin:2px 0 -4px}
.kb-out{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.ing{padding:12px 14px;border-radius:12px;background:var(--sunk)}
.ing h4{display:flex;justify-content:space-between;gap:10px;margin:0 0 6px}
.ing h4 span{font-weight:400;color:var(--ink-3)}
.ing ul{margin:0;padding-left:18px;display:grid;gap:2px;font-size:15px}
.stl{list-style:none;margin:0;padding:0;counter-reset:s}
.stl li{counter-increment:s;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stl li:first-child{border-top:0;padding-top:2px}
.stl label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;cursor:pointer;font-size:15.5px;line-height:1.4}
.stl input{accent-color:var(--ink);width:20px;height:20px;margin:2px 0 0}
.stl label span::before{content:counter(s) ". ";font-weight:700}
.stl .is-done label span{color:var(--ink-3);text-decoration:line-through}
.chip.stl-t{min-height:34px;padding:0 10px;font-variant-numeric:tabular-nums}
.chip.stl-t[aria-pressed="true"]{background:var(--ticket);border-color:var(--ticket);color:var(--ticket-ink)}
.props{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.props li{display:grid;gap:3px;padding:12px 14px;border-radius:12px;background:var(--sunk);min-width:0}
.props b{font:700 19px/1.15 var(--f-d);font-stretch:86%;text-wrap:balance}
.props--s b{font-size:16px}
.props li > span{font-size:14.5px;color:var(--ink-2)}
.yr{font:400 13px/1 var(--f-m);font-stretch:normal;color:var(--ink-3);margin-left:4px}
.prop-l{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:6px;font-size:14.5px;font-weight:700}
.prop-l a{display:inline-flex;align-items:center;gap:4px}
.prop-l .ic{width:14px;height:14px}
.prop-n{margin-top:4px;font-size:13.5px;color:var(--ink-3)}
.pairs{margin:8px 0 0;display:grid;grid-template-columns:minmax(0,1fr);font-size:15px}
.pairs div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.pairs dt{color:var(--ink-2)}
.pairs dd{margin:0;font-weight:700;text-align:right}
.mini{margin:8px 0 0;padding-left:20px;display:grid;gap:5px;font-size:15px}
.guide{margin:0}
.guide div{padding:9px 0;border-top:1px solid var(--line)}
.guide div:first-child{border-top:0;padding-top:0}
.guide dt{font-weight:700}
.guide dd{margin:1px 0 0;font-size:14.5px;color:var(--ink-2)}
.in--y{max-width:190px}
.links{list-style:none;margin:0;padding:0;display:grid;gap:6px;justify-items:start}
.links .btn{min-height:44px;padding:8px 14px;text-align:left;line-height:1.25;justify-content:flex-start}
.links .ic{width:15px;height:15px;color:var(--ink-3)}
.wc{float:right;font-weight:400;font-size:13px;color:var(--ink-3)}
.wc.is-ok{color:var(--good);font-weight:700}
/* lo studio: lo strumento a tutto schermo */
.sheet--studio{height:100%;max-height:100%;border-radius:0}
@media (min-width:700px){.sheet--studio{height:auto;max-height:94%;border-radius:24px;width:min(100%,620px)}}
.stu-top{margin:0 48px 12px 0;min-height:40px;display:flex;align-items:center}
.stu-top .lnk{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:15px}
.stu h2{margin-bottom:10px}
.stu .row-btns{margin-top:10px}
.tmr{display:grid;justify-items:center;gap:6px;text-align:center;padding:6px 0 4px}
.ring--xl{width:min(62vw,250px);height:min(62vw,250px)}
.ring--xl .ring-t{font-size:clamp(40px,13vw,56px)}
.ring--breath[data-ph] svg{transition:transform var(--ph,4s) ease-in-out}
.ring--breath[data-ph="in"] svg,.ring--breath[data-ph="hold"] svg{transform:scale(1.08)}
.ring--breath[data-ph="out"] svg{transform:scale(.86)}
.tmr-n{font-size:14px;font-weight:700;color:var(--ink-2);min-height:21px}
.tmr-l{font:800 clamp(26px,7vw,32px)/1.05 var(--f-d);font-stretch:80%;text-wrap:balance;min-height:34px}
.tmr-h{font-size:15.5px;color:var(--ink-2);max-width:40ch;min-height:46px}
.tmr-x{font-size:13.5px;color:var(--ink-3);min-height:20px}
.tmr-b{justify-content:center}
.tmr--fin{padding-top:20px;gap:12px}
.tap{display:grid;justify-items:center;width:100%;max-width:280px;margin-top:12px;padding:14px;border-radius:18px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.tap b{font:600 44px/1 var(--f-b);font-variant-numeric:tabular-nums}
.tap span{font-size:14px;font-weight:700;color:var(--ink-2)}
.tap:active{background:var(--ticket);border-color:var(--ticket);color:var(--ticket-ink)}
.tap:active span{color:inherit}
.tap--s{max-width:none;margin-top:0}
.tap--s b{font-size:32px}
/* giochi */
.card1{display:grid;gap:4px;justify-items:center;align-content:center;text-align:center;min-height:116px;padding:20px 14px;border-radius:14px;background:var(--ticket);color:var(--ticket-ink)}
.card1 b{font:800 clamp(26px,7.4vw,34px)/1.05 var(--f-d);font-stretch:80%;text-wrap:balance}
.card1 span{font-size:14.5px;font-weight:600}
.card1 em{font-style:normal;font-weight:700;font-size:20px;margin-top:6px;padding-top:8px;border-top:2px dashed currentColor}
.card1.is-hid{background:var(--sunk);color:var(--ink)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.score > div{display:grid;justify-items:center;gap:2px;padding:10px;border-radius:12px;background:var(--sunk)}
.score span{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.score b{font:600 38px/1 var(--f-b);font-variant-numeric:tabular-nums}
.score p{display:flex;gap:8px;margin-top:4px}
.step--p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tally button{display:grid;justify-items:center;align-content:center;gap:1px;min-height:68px;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.tally b{font:600 24px/1 var(--f-b);font-variant-numeric:tabular-nums}
.tally span{font-size:13px;font-weight:600;color:var(--ink-2)}
.tally button:active{background:var(--ticket);border-color:var(--ticket)}
.cnt{display:grid;gap:8px}
.cnt .tap{margin-top:0;max-width:none}
.cnt p{display:flex;flex-wrap:wrap;gap:6px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mem button{aspect-ratio:1;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:var(--ink);color:var(--bg)}
.mem .ic{width:44%;height:44%}
.mem .is-up{background:var(--ticket);color:var(--ticket-ink)}
.mem .is-ok{background:var(--sunk);color:var(--good)}
.rps-s{display:flex;align-items:baseline;gap:8px;font-size:15px}
.rps-s b{font:600 30px/1 var(--f-b)}
.rps-s span{flex:1;border-bottom:2px dashed var(--line)}
.rps-l{font-size:15px;color:var(--ink-2)}
.quiz-t{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.quiz-r{font-size:17px}
.quiz-r b{font-size:26px}
.plate{justify-self:start;padding:8px 26px;border-radius:8px;border:3px solid #101A30;background:#FFFFFF;color:#101A30;font:700 28px/1 var(--f-m);letter-spacing:.06em;box-shadow:inset 12px 0 0 #1F5FBF,inset -12px 0 0 #1F5FBF}
.plate--w{padding:10px 14px;box-shadow:none;letter-spacing:.1em;font-size:24px;overflow-wrap:anywhere}
.ans{display:flex;gap:8px;align-items:center}
.ans .in{max-width:170px}
.morse{display:flex;flex-wrap:wrap;gap:12px 14px;min-height:66px;padding:12px;border-radius:12px;background:var(--sunk)}
.mo-l{display:grid;justify-items:center;gap:6px}
.mo-l b{font:700 18px/1 var(--f-m)}
.mo-l i{display:flex;gap:3px;align-items:center;height:10px}
.mo-l u{display:block;height:8px;border-radius:4px;background:var(--ink)}
.mo-l .mo-dot{width:8px}
.mo-l .mo-dash{width:22px}
.mo-sp{width:14px}
/* fotocamera */
.cam{display:grid;gap:10px}
.cam-view{position:relative;overflow:hidden;display:grid;place-items:center;aspect-ratio:4/3;border-radius:16px;background:#0B1220}
.cam-view video,.cam-view canvas{display:block;width:100%;height:100%}
.cam-view video{object-fit:cover}
.cam-view canvas{object-fit:contain}
.cam-ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;pointer-events:none}
.cam-flash{position:absolute;inset:0;background:#FFFFFF;opacity:0;pointer-events:none}
.cam-flash.go{animation:flash .28s ease-out}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.cam-msg{position:absolute;left:10px;right:10px;bottom:10px;margin:0;padding:10px 12px;border-radius:12px;background:rgba(11,18,32,.88);color:#FFFFFF;font-size:14px;font-weight:600}
.cam-n{font-size:15px;min-height:22px}
.cam-bar{display:flex;align-items:center;justify-content:center;gap:26px}
.cam-bar .rnd:disabled{opacity:.35;cursor:not-allowed}
.shut{width:78px;height:78px;padding:0;display:grid;place-items:center;border-radius:50%;border:4px solid var(--ink);background:var(--card)}
.shut span{width:58px;height:58px;border-radius:50%;background:var(--stamp);transition:transform .08s}
.shut:active span{transform:scale(.88)}
.cam-opt{display:flex;flex-wrap:wrap;gap:6px}
.cam-file{position:relative;overflow:hidden;cursor:pointer}
.cam-file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.cam-file:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.cam-strip{list-style:none;margin:0;padding:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.cam-strip li{flex:none}
.cam-strip img{display:block;width:62px;height:62px;object-fit:cover;border-radius:8px}
.cam-out{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:var(--sunk)}
h2 + .cam{margin-top:12px}
.cam + .row-btns{margin-top:14px}
.cam + .row-btns + .small{margin-top:10px}
/* foglio da disegno */
.dpad{overflow:hidden;border-radius:14px;border:1.5px solid var(--line);background:#FFFDF6;touch-action:none}
.dpad canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.dpad-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 0}
.swatches{display:flex;gap:8px}
.sw{width:36px;height:36px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--sw)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
/* meta, cielo, registratore */
.fld--in{margin-top:0}
.mt{display:grid;gap:6px;padding:14px;border-radius:14px;background:var(--sunk)}
.mt-k{font-size:13px;font-weight:700;color:var(--ink-2)}
.mt-n{font:800 clamp(22px,6vw,27px)/1.06 var(--f-d);font-stretch:80%;text-wrap:balance}
.mt-d{font-size:14.5px;color:var(--ink-2)}
.mt-l{font-size:15.5px}
.mt-x{font-size:14px;color:var(--ink-2)}
.mt .row-btns{margin-top:6px}
.mt .note{margin:4px 0}
.sky{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.sky-fig{width:96px}
.sky-fig svg{display:block;width:100%}
.sky-b{font:700 19px/1.15 var(--f-d);font-stretch:86%;margin-bottom:4px}
.sky p{font-size:15px}
.sky p + p{margin-top:4px}
.kb .facts{margin:0}
.mon .mo-d{fill:var(--sunk);stroke:var(--line);stroke-width:1}
.mon .mo-l{fill:var(--ticket)}
.cps .cp-r{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
.cps text{font:700 11px var(--f-b);fill:var(--ink-3)}
.cps .cp-a{fill:var(--stamp)}
.cps .cp-c{fill:var(--ink)}
.consts{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.consts li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center}
.cst{display:block;width:84px;height:84px;border-radius:12px;background:#0A1232}
.cst path{stroke:#6F7FB5;stroke-width:1.2;fill:none}
.cst circle{fill:#FFFFFF}
.consts b{display:block}
.consts span{font-size:14.5px;color:var(--ink-2)}
.rec-t{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2)}
.rec-t b{font:600 28px/1 var(--f-b);font-variant-numeric:tabular-nums;color:var(--ink)}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--stamp);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.rec-a{display:block;width:100%}
/* creazioni e quaderno */
.alb{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px 10px}
.alb button{width:100%;display:grid;gap:1px;padding:0;border:0;background:none;color:inherit;text-align:left;line-height:1.25}
.alb img,.alb-ic{display:grid;place-items:center;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--card);color:var(--ink-3)}
.alb-ic .ic{width:30px;height:30px}
.alb b{font-size:13.5px;margin-top:5px}
.alb small{font-size:12px;color:var(--ink-3)}
.nt-p{font-size:16px}

/* ---------- avvisi ---------- */
.toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{max-width:440px;padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14.5px;font-weight:700;box-shadow:0 10px 26px -14px rgba(8,13,26,.7);animation:up .2s ease-out;transition:opacity .3s}
.toast--warn{background:var(--warn-bg);color:var(--warn-ink)}
.toast.bye{opacity:0}
@media (min-width:900px){.toasts{top:auto;bottom:28px}}
.tip{position:fixed;z-index:70;max-width:260px;padding:6px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

</style>

  <main class="view" id="view" tabindex="-1">

<script>
/* Scaccianoia — contenuti: catalogo delle attività gratuite, città, badge, giochi. */
(function (root) {

  };

  var KIT = {

  var KIT_DEFAULT = ['carta', 'colori', 'forbici', 'carte', 'libri', 'cucina', 'foto', 'web'];

  /* Riga: [id, titolo, come si fa, minuti minimi, minuti massimi, dove (i al chiuso, o all'aperto, x ovunque),

     Sigle: S serve il sole · R va bene con pioggia leggera · r serve che piova · p dopo la pioggia · N neve · W vento

  var ROWS = [

    ['a005', "Fumetto della tua giornata", "Quattro vignette e omini stilizzati: racconta la cosa più buffa che ti è successa oggi.", 15, 30, 'x', 'sb', 1, 'cre', 'carta', 'q', ''],
    ['a006', "Caccia al colore", "Scegli un colore e fotografa dieci cose di quel colore intorno a te. Poi componi il mosaico.", 10, 30, 'x', 'sdgb', 2, 'cre', 'foto', '', ''],
    ['a007', "Caccia alle ombre", "Con il sole le ombre disegnano da sole: fotografa le più strane o ricalcane il contorno.", 15, 40, 'o', 'sdb', 2, 'cre', 'foto', 'Sg', ''],
    ['a008', "Riflessi nelle pozzanghere", "Dopo la pioggia la città si specchia. Cerca il riflesso più bello e fotografalo capovolto.", 15, 40, 'o', 'sd', 2, 'cre', 'foto', 'Rp', ''],
    ['a009', "Poesia cancellata", "Prendi una pagina di giornale e annerisci tutto, tranne le parole che formano la tua poesia.", 15, 30, 'i', 's', 1, 'cre', 'colori', 'q', ''],
    ['a010', "Lettera scritta a mano", "A un amico, a un nonno o a te tra dieci anni. Carta, penna e nessuna fretta.", 20, 40, 'i', 's', 1, 'cre', 'carta', 'q', ''],
    ['a011', "Robot di scatole", "Con tappi, scatole e rotoli di cartone costruisci un robot o un animale mai visto.", 30, 60, 'i', 'sdb', 2, 'cre', 'forbici', '', ''],
    ['a012', "La mappa del tuo quartiere", "Disegnala a memoria: i posti che contano per te, le scorciatoie, i segreti.", 20, 40, 'i', 'sb', 1, 'cre', 'carta,colori', 'q', ''],
    ['a013', "Colonna sonora immaginaria", "Crea la playlist di un film che non esiste. Poi inventa titolo e trama in una riga.", 15, 40, 'x', 'sd', 1, 'cre', 'web', 'q', ''],
    ['a014', "Concerto in salotto", "Scegli tre canzoni, metti il testo davanti e cantale a tutto volume.", 10, 30, 'i', 'sdgb', 2, 'cre', 'web', '', ''],

    ['a016', "Sassi dipinti", "Raccogli sassi lisci, dipingili e lasciali in giro come sorpresa per chi passa.", 30, 60, 'x', 'sdb', 1, 'cre', 'colori', '', ''],
    ['a017', "Cartone animato col telefono", "Venti foto e un oggetto che si sposta di poco ogni volta: hai girato uno stop motion.", 30, 60, 'i', 'sdb', 2, 'cre', 'foto', 'q', ''],
    ['a018', "Forme tra le nuvole", "Sdraiati, guarda le nuvole e trova cinque figure. Disegnale o fotografale.", 10, 30, 'o', 'sdb', 1, 'cre', '', 'gB', ''],
    ['a019', "Autoritratto con ciò che trovi", "Componi la tua faccia con oggetti di casa: bottoni, mollette, pasta. Poi fotografala.", 10, 25, 'i', 'sb', 1, 'cre', 'foto', 'q', ''],

    ['a020', "Venti minuti in una via nuova", "Dieci minuti in una direzione che non prendi mai, dieci per tornare.", 20, 30, 'o', 'sd', 2, 'mov', '', '', ''],
    ['a021', "Stretching in sette mosse", "Collo, spalle, schiena, polsi, anche, polpacci e un respiro profondo. Lentamente.", 5, 10, 'x', 's', 1, 'mov', '', 'qw', ''],
    ['a022', "Sfida delle scale", "Sali e scendi le scale di casa per dieci minuti a ritmo di musica.", 10, 15, 'i', 's', 3, 'mov', '', '', ''],
    ['a023', "Circuito a corpo libero", "Quattro giri: 10 squat, 10 piegamenti anche sulle ginocchia, 20 secondi di plank, un minuto di pausa.", 15, 25, 'x', 'sd', 3, 'mov', '', '', ''],
    ['a024', "Balla tre canzoni", "Chiudi la porta, alza il volume e balla come se nessuno guardasse.", 10, 15, 'i', 'sdgb', 3, 'mov', 'web', '', ''],
    ['a025', "Yoga per chi comincia", "Segui una lezione gratuita online. Basta un asciugamano steso per terra.", 20, 40, 'i', 's', 2, 'mov', 'web', '', ''],
    ['a026', "Giro in bici senza meta", "Parti e a ogni incrocio scegli la strada più verde.", 30, 90, 'o', 'sd', 3, 'mov', 'bici', 'g', ''],
    ['a027', "Corsa e cammino al parco", "Alterna due minuti di corsa leggera e uno di camminata per venti minuti.", 20, 40, 'o', 'sd', 3, 'mov', '', '', 'park'],
    ['a028', "Record di palleggi", "Quanti palleggi di fila riesci a fare? Batti il tuo record tre volte.", 10, 30, 'o', 'sdgb', 3, 'mov', 'palla', 'g', ''],
    ['a029', "Giro degli attrezzi", "Molti parchi hanno attrezzi liberi per allenarsi: prova un giro completo.", 20, 40, 'o', 'sd', 3, 'mov', '', 'g', 'sport'],
    ['a030', "Salto della corda", "Tre serie da un minuto. È l'allenamento più economico del mondo.", 5, 15, 'x', 'sb', 3, 'mov', 'corda', '', ''],
    ['a031', "Passeggiata sotto l'ombrello", "Pioggia leggera, strade vuote, odore di terra bagnata. Dieci minuti bastano.", 10, 30, 'o', 'sd', 1, 'mov', '', 'Rr', ''],
    ['a032', "Passo svelto contro il freddo", "Vestiti a strati e cammina veloce: dopo cinque minuti il freddo non si sente più.", 15, 30, 'o', 'sd', 2, 'mov', '', 'C', ''],
    ['a033', "Campana sul marciapiede", "Disegna la campana con i gessetti e sfida chi è con te.", 15, 40, 'o', 'dgb', 2, 'mov', 'gessi', 'g', ''],
    ['a034', "Fino al punto più alto", "Cerca il punto più alto raggiungibile a piedi e guarda la città dall'alto.", 45, 120, 'o', 'sdg', 3, 'mov', '', 'gZ', 'view'],
    ['a035', "Equilibrio su una gamba", "Trenta secondi per lato mentre aspetti. Poi prova a occhi chiusi.", 2, 5, 'x', 's', 1, 'mov', '', 'w', ''],
    ['a036', "Piedi nell'acqua", "Fiume, lago o mare: togli le scarpe e cammina dove l'acqua arriva alle caviglie.", 20, 60, 'o', 'sdgb', 2, 'mov', '', 'HSg', 'nature'],
    ['a037', "Ginnastica da sedia", "Da seduto: solleva le ginocchia, ruota le caviglie, apri e chiudi le braccia. Dieci volte ciascuno.", 5, 10, 'x', 's', 1, 'mov', '', 'qw', ''],
    ['a148', "Passeggiata a sorpresa", "A ogni incrocio decide il caso. Sette svolte e una missione da compiere lungo la strada.", 20, 40, 'o', 'sdgb', 2, 'mov', '', '', ''],

    ['a038', "Un'ora in biblioteca", "Entra, scegli uno scaffale a caso e apri il terzo libro da sinistra. Leggine dieci pagine.", 30, 120, 'i', 'sd', 1, 'cul', '', 'qj', 'books'],
    ['a039', "Museo a ingresso gratuito", "La prima domenica del mese i musei statali non si pagano. Scegline uno che non conosci.", 60, 180, 'i', 'sdgb', 2, 'cul', '', 'jm', 'museum'],
    ['a040', "Una chiesa come un museo", "Affreschi, cripte, organi antichi: molte chiese custodiscono capolavori e l'ingresso è libero.", 20, 60, 'i', 'sd', 1, 'cul', '', 'jg', ''],
    ['a041', "Giro delle targhe", "Leggi targhe e lapidi di una via del centro: scopri chi ha abitato lì e cosa è successo.", 20, 45, 'o', 'sd', 2, 'cul', '', 'g', 'art'],
    ['a042', "Un film di prima che nascessi", "Su RaiPlay ci sono centinaia di film gratuiti. Scegline uno uscito prima della tua nascita.", 90, 150, 'i', 'sdg', 1, 'cul', 'web', 'q', ''],
    ['a043', "Podcast in cammino", "Una puntata di storia o di scienza mentre cammini senza una meta precisa.", 20, 60, 'o', 's', 2, 'cul', 'web', '', ''],
    ['a044', "Murales e arte di strada", "Cerca murales, adesivi e scritte curiose nel quartiere. Fai la tua classifica dei cinque migliori.", 30, 60, 'o', 'sd', 2, 'cul', '', 'g', 'art'],
    ['a045', "Un album dall'inizio alla fine", "Senza saltare tracce e senza fare altro. Come si faceva una volta.", 35, 60, 'i', 's', 1, 'cul', 'web', 'q', ''],
    ['a046', "Museo dal divano", "Uffizi, Musei Vaticani, Louvre: molte collezioni si visitano online senza pagare.", 20, 45, 'i', 'sdb', 1, 'cul', 'web', 'q', ''],
    ['a047', "Un racconto breve", "Calvino, Buzzati, Rodari: un racconto si legge in mezz'ora. Cercalo in casa o in biblioteca.", 20, 45, 'x', 's', 1, 'cul', 'libri', 'q', ''],
    ['a048', "Il mercato da turista", "Gira tra i banchi senza comprare niente: profumi, voci, colori. Guardare è gratis.", 20, 60, 'o', 'sd', 2, 'cul', '', 'g', 'market'],
    ['a049', "Libri e giornali in prestito digitale", "Con la tessera della biblioteca spesso puoi leggere ebook e quotidiani online. Chiedi come attivarla.", 15, 60, 'i', 's', 1, 'cul', 'web', 'q', ''],
    ['a050', "Il monumento sotto casa", "Cerca la storia del monumento o della fontana più vicina. Poi vai a guardarla con occhi nuovi.", 20, 45, 'o', 'sdb', 2, 'cul', 'web', 'g', 'art'],

    ['a051', "Dieci parole in una lingua nuova", "Scegli una lingua, impara dieci parole e usale tutte in una frase assurda.", 10, 20, 'x', 'sd', 1, 'imp', '', 'qw', ''],
    ['a052', "Un nodo che serve", "Impara la gassa d'amante con un laccio delle scarpe. Tiene sempre e si scioglie subito.", 10, 20, 'x', 'sb', 1, 'imp', '', 'q', ''],
    ['a053', "Capitali in due minuti", "Quante capitali sai dire in due minuti? Poi impara quelle di un continente.", 5, 15, 'x', 'sdgb', 1, 'imp', '', 'qw', ''],
    ['a054', "Una lezione gratis online", "Scegli una lezione gratuita su qualcosa che hai sempre voluto capire: astronomia, economia, cucina.", 20, 60, 'i', 's', 1, 'imp', 'web', 'q', ''],
    ['a055', "Trucco con le carte", "Impara un gioco di prestigio semplice e provalo finché riesce tre volte di fila.", 15, 30, 'i', 'sb', 1, 'imp', 'carte', 'q', ''],
    ['a056', "Tre alberi con nome e cognome", "Guarda foglie e corteccia di tre alberi vicino a casa e scopri come si chiamano.", 20, 40, 'o', 'sdb', 2, 'imp', '', 'gV', 'park'],
    ['a057', "Il tuo nome in Morse", "Punto e linea: impara a battere il tuo nome sul tavolo. Poi quello di chi ti sta vicino.", 5, 15, 'x', 'sb', 1, 'imp', '', 'qw', ''],
    ['a058', "Conti a mente con le targhe", "Somma o moltiplica le cifre delle targhe che vedi. Parti facile, poi sali di livello.", 2, 10, 'x', 's', 1, 'imp', '', 'qw', ''],
    ['a059', "Il tuo nome con le mani", "Impara l'alfabeto della lingua dei segni italiana e segna il tuo nome.", 10, 20, 'x', 'sdb', 1, 'imp', 'web', 'q', ''],
    ['a060', "Giocoliere con tre calzini", "Tre calzini arrotolati: prima uno, poi due, poi la cascata. Serve solo pazienza.", 15, 30, 'i', 'sb', 2, 'imp', '', '', ''],
    ['a061', "Le costellazioni di stasera", "Trova il Grande Carro e da lì la Stella Polare. In inverno cerca le tre stelle di Orione.", 15, 40, 'o', 'sdgb', 1, 'imp', '', 'nk', ''],
    ['a062', "Scrivi con l'altra mano", "Il tuo nome e una frase con la mano che non usi mai. Dopo dieci righe migliora già.", 5, 10, 'x', 'sb', 1, 'imp', 'carta', 'q', ''],
    ['a063', "Da una voce all'altra", "Apri una voce a caso di Wikipedia e arriva a «Italia» con meno clic possibile.", 5, 20, 'x', 'sd', 1, 'imp', 'web', 'qw', ''],
    ['a064', "Le manovre che salvano", "Guarda un video ufficiale sulla disostruzione e sul massaggio cardiaco. Dieci minuti che possono servire.", 10, 20, 'i', 'sd', 1, 'imp', 'web', 'q', ''],
    ['a065', "Leggere il cielo", "Cumuli, cirri, nembi: impara tre tipi di nuvole e prova a prevedere il tempo di domani.", 10, 20, 'x', 'sdb', 1, 'imp', '', 'qg', ''],
    ['a066', "Parole di un altro dialetto", "Chiedi a un nonno o a un amico cinque parole del suo dialetto e prova a usarle.", 10, 20, 'x', 'd', 1, 'imp', '', 'q', ''],

    ['a067', "Respiro 4-7-8", "Inspira per 4, trattieni per 7, espira per 8. Quattro giri e ti senti più calmo.", 2, 5, 'x', 's', 1, 'rel', '', 'qw', ''],
    ['a068', "Conta i suoni", "Chiudi gli occhi e conta tutti i suoni che senti: vicini, lontani, dentro di te.", 3, 10, 'x', 's', 1, 'rel', '', 'qw', ''],
    ['a069', "Il tramonto, e nient'altro", "Trova un punto con l'orizzonte libero dieci minuti prima del tramonto. Telefono in tasca.", 15, 30, 'o', 'sdg', 1, 'rel', '', 'u', 'view'],
    ['a070', "Tisana lenta", "Preparala e bevila senza telefono, guardando fuori dalla finestra.", 10, 20, 'i', 's', 1, 'rel', 'cucina', 'q', ''],
    ['a071', "Ascolta la pioggia", "Finestra socchiusa e luce bassa: dieci minuti ad ascoltare soltanto la pioggia.", 5, 15, 'i', 'sd', 1, 'rel', '', 'qr', ''],
    ['a072', "Il temporale dalla finestra", "Al sicuro, conta i secondi tra lampo e tuono: ogni tre secondi è circa un chilometro.", 5, 20, 'i', 'sdgb', 1, 'rel', '', 'qT', ''],
    ['a073', "Pisolino da venti minuti", "Metti la sveglia tra venti minuti, non uno di più. Ti alzi più sveglio di prima.", 20, 25, 'i', 's', 1, 'rel', '', '', ''],
    ['a074', "Tre cose belle di oggi", "Scrivile, anche se sono minuscole. Rilette tra un mese valgono doppio.", 3, 10, 'x', 's', 1, 'rel', '', 'qw', ''],
    ['a075', "Cento passi lenti", "Cammina lentissimo e conta i respiri. Sembra strano, poi funziona.", 5, 15, 'x', 's', 1, 'rel', '', '', ''],

    ['a077', "Stelle dal balcone", "Spegni le luci, aspetta cinque minuti che gli occhi si abituino e alza lo sguardo.", 10, 30, 'o', 'sdg', 1, 'rel', '', 'nk', ''],
    ['a078', "Mandala col bicchiere", "Traccia cerchi con un bicchiere e riempili di motivi ripetuti. Rilassa più di quanto credi.", 20, 40, 'i', 'sb', 1, 'rel', 'carta,colori', 'q', ''],
    ['a079', "Una panchina, senza telefono", "Scegli una panchina e guarda la gente passare per un quarto d'ora.", 15, 30, 'o', 's', 1, 'rel', '', 'gqB', 'park'],

    ['a081', "Album dei ricordi", "Riguarda le foto di cinque anni fa e manda la più bella a chi c'era.", 10, 30, 'x', 's', 1, 'rel', 'foto', 'qw', ''],
    ['a111', "Cerca il fresco gratis", "Chiostri, chiese, biblioteche e parchi ombrosi: con questo caldo sono i posti migliori, e non costano niente.", 20, 60, 'x', 'sd', 1, 'rel', '', 'H', ''],

    ['a082', "Chiama invece di scrivere", "Telefona a qualcuno che non senti da più di un anno. Cinque minuti cambiano la giornata a entrambi.", 10, 30, 'x', 's', 1, 'soc', '', 'q', ''],

    ['a089', "Nomi, cose, città", "Una lettera, cinque categorie, un minuto. Vince chi trova le parole che gli altri non hanno.", 15, 30, 'x', 'dgb', 1, 'soc', 'carta', 'q', ''],
    ['a090', "Tre messaggi gentili", "Scrivi a tre persone una cosa che apprezzi di loro. Senza motivo, solo perché è vera.", 5, 10, 'x', 's', 1, 'soc', '', 'qw', ''],
    ['a091', "Serata giochi da tavolo", "Tira fuori i giochi che prendono polvere e organizza un torneo.", 45, 120, 'i', 'dgb', 1, 'soc', 'tavolo', 'q', ''],
    ['a092', "Picnic svuotadispensa", "Panini con quello che c'è, una coperta e il prato più vicino.", 60, 120, 'o', 'dgb', 2, 'soc', 'cucina', 'SgB', 'picnic'],
    ['a093', "Albero di famiglia", "Chiama uno zio o un nonno e ricostruisci la famiglia fino ai bisnonni.", 30, 60, 'x', 'sd', 1, 'soc', 'carta', 'q', ''],

    ['a096', "Erbario in un libro", "Raccogli cinque foglie diverse e mettile ad asciugare tra le pagine di un libro pesante.", 20, 45, 'o', 'sdb', 2, 'nat', 'libri', 'gV', 'park'],
    ['a097', "Orto dagli scarti", "Semi di limone, il fondo del sedano, un nocciolo di avocado: mettili in acqua e guarda cosa spunta.", 10, 20, 'i', 'sb', 1, 'nat', 'cucina', 'q', ''],

    ['a100', "Slittino con un sacco", "Un sacco robusto e una discesa innevata lontana dalle strade.", 20, 60, 'o', 'dgb', 3, 'nat', '', 'Ng', ''],

    ['a102', "Caccia all'arcobaleno", "Sole alle spalle e pioggia davanti: l'arcobaleno compare dalla parte opposta al sole.", 10, 20, 'o', 'sdgb', 1, 'nat', '', 'Rpg', ''],

    ['a104', "Una talea nel bicchiere", "Taglia un rametto di menta o di basilico e mettilo in acqua. In un paio di settimane spuntano le radici.", 10, 15, 'i', 'sb', 1, 'nat', '', 'q', ''],
    ['a106', "Segui l'acqua", "Raggiungi il fiume, il canale o il mare più vicino e seguine la riva per un tratto.", 30, 90, 'o', 'sd', 2, 'nat', '', 'g', 'nature'],

    ['a108', "Gocce in primo piano", "Dopo la pioggia fotografa da vicinissimo le gocce su foglie e ragnatele.", 10, 30, 'o', 's', 1, 'nat', 'foto', 'pg', ''],

    ['a110', "Il viale più colorato", "Cerca il viale con più foglie a terra e scatta la foto più colorata dell'anno.", 20, 45, 'o', 'sdgb', 2, 'nat', 'foto', 'gA', 'park'],
    ['a113', "Cinque sensi al parco", "Trova una cosa da vedere, una da toccare, una da ascoltare, una da annusare. E respira.", 10, 20, 'o', 'sdb', 1, 'nat', '', 'g', 'park'],

    ['a114', "Il cassetto del caos", "Svuota un cassetto, tieni solo ciò che usi davvero e metti da parte il resto da regalare.", 15, 30, 'i', 's', 2, 'cas', '', '', ''],

    ['a120', "Stanza nuova, stessi mobili", "Sposta due mobili e cambia posto a un quadro: la stanza sembrerà un'altra.", 30, 60, 'i', 'sd', 3, 'cas', '', '', ''],
    ['a121', "Menù della settimana", "Guarda cosa c'è in dispensa e pianifica i pasti. Risparmi tempo, soldi e sprechi.", 15, 25, 'i', 's', 1, 'cas', 'carta', 'q', ''],
    ['a122', "La ricetta di famiglia", "Fatti dettare da un familiare una ricetta di casa e provala oggi.", 45, 90, 'i', 'sdb', 2, 'cas', 'cucina', '', ''],

    alberi: [["Tiglio", "Foglia a cuore con il bordo seghettato. In estate i fiori profumano tutta la via."], ["Platano", "Foglia grande a cinque punte e corteccia che si stacca a chiazze, come una mimetica."],

      return getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&q=%5B' + kind + '%5D&viewbox=' + box + '&bounded=1&limit=40&accept-language=it', 8000)
        .then(function (list) { okN++; all = C.mergePlaces(all, C.parseNominatim(list, lat, lon)); if (onPart) onPart(all); }, function () {});
    });

/* Un ventaglio di punti intorno alla posizione: serve a sapere dov'è il punto più alto raggiungibile e da che parte sta il mare. */

  var url = 'https://api.open-meteo.com/v1/elevation?latitude=' + pts.map(function (p) { return p.lat.toFixed(5); }).join(',') + '&longitude=' + pts.map(function (p) { return p.lon.toFixed(5); }).join(',');

  close: function () { clearInterval(this.pt); this.pt = null; if (this.url) { try { URL.revokeObjectURL(this.url); } catch (e) {} } this.url = ''; this.it = null; }
};
ACT['alb-open'] = function (el) { Viewer.open(el.getAttribute('data-id')); };
ACT['alb-dl'] = function () { var x = Viewer.it; if (x) saveBlob(x.out || x.blobs[0], Viewer.name()); };
ACT['alb-sh'] = function () { var x = Viewer.it; if (x) shareBlob(x.out || x.blobs[0], Viewer.name(), x.title); };
var delArmed = 0;
ACT['alb-del'] = function (el) {
  if (Date.now() - delArmed > 5000) { delArmed = Date.now(); el.lastChild.textContent = 'Sicuro? Tocca ancora per eliminarla'; return; }
  delArmed = 0; var x = Viewer.it; if (!x) return; Alb.del(x.id).then(function () { Sheet.close(); render(); toast('Eliminata'); });
};
ACT['note-open'] = function (el) {
  var k = el.getAttribute('data-id'), n = S.notes[k]; if (!n) return; var a = actById(k.split('@')[0]), blocks = a ? (KITS[a.id] || []).filter(function (b) { return b[0] === 'write'; }) : [], labels = {};
  blocks.forEach(function (b) { (b[1].fields || []).forEach(function (f) { labels[f[0]] = f[1]; }); });
  var body = Object.keys(n.v).filter(function (f) { return n.v[f]; }).map(function (f) { return (labels[f] ? '<h3 class="sub-h">' + esc(labels[f]) + '</h3>' : '') + '<p class="nt-p">' + esc(n.v[f]).replace(/\n/g, '<br>') + '</p>'; }).join('');
  UI.noteKey = k;
  Sheet.open('<p class="pl-kind">' + ic('note') + 'Dal tuo quaderno, ' + dataBreve(new Date(n.ts)) + '</p><h2>' + esc(a ? a.t : 'Appunto') + '</h2>' + body + '<div class="row-btns"><button class="btn btn--line btn--s" data-act="note-copy">' + ic('copy') + 'Copia</button>' +
    (a ? '<button class="btn btn--line btn--s" data-act="act-open" data-id="' + esc(a.id) + '">Riapri il biglietto</button>' : '') + '<button class="btn btn--quiet btn--s" data-act="note-del">' + ic('trash') + 'Elimina</button></div>', { label: 'Appunto' });
};
ACT['note-copy'] = function () { var n = S.notes[UI.noteKey]; if (n) copyText(Object.keys(n.v).map(function (f) { return n.v[f]; }).filter(Boolean).join('\n')); };
ACT['note-del'] = function (el) {
  if (Date.now() - delArmed > 5000) { delArmed = Date.now(); el.lastChild.textContent = 'Sicuro? Tocca ancora per eliminarlo'; return; }
  delArmed = 0; delete S.notes[UI.noteKey]; save(); Sheet.close(); render(); toast('Eliminato');
};

start();

})();
</script>
